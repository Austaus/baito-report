<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Baito Monthly Report</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Arubaito Monthly Report</h1>

<div class="form">
  <label>Name:</label>
  <input id="name" type="text" />

  <label>Restaurant:</label>
  <input id="restaurant" type="text" />

  <label>Month & Year:</label>
  <input id="month" type="text" placeholder="January 2025" />

  <label>Hourly Wage (¥):</label>
  <input id="wage" type="number" value="1150" />

 <p><b>Work entries will be generated automatically.</b></p>





  <button onclick="generatePDF()">Generate PDF Preview</button>

<h3>PDF Preview</h3>
<iframe id="pdfPreview" width="100%" height="500px"></iframe>
<p id="mobileHint" style="display:none;">
  PDF preview opens in a new tab on mobile.
</p>

<button onclick="printPDF()">Print PDF</button>
<button onclick="downloadPDF()">Download PDF</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
